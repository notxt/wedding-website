version: 0.0
os: linux

files:
  - source: server
    destination: /opt/wedding-website
  - source: wedding-website.service
    destination: /etc/systemd/system

permissions:
  - object: /opt/wedding-website/server
    owner: wedding
    group: wedding
    mode: "0755"
  - object: /etc/systemd/system/wedding-website.service
    owner: root
    group: root
    mode: "0644"

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
