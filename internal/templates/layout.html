<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#231f20">
<title>{{ block "title" . }}Michael &amp; Adrien — Wedding{{ end }}</title>
<link rel="preload" href="/static/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<nav>

<label for="nav-toggle" class="nav-toggle-label">
<span class="nav-toggle-bars" aria-hidden="true"></span>
<span>Menu</span>
</label>
<ul>
<li><a href="/"{{ if eq .Active "/" }} aria-current="page"{{ end }}>Home</a></li>

<li>Information

</ul>
</li>
<li><a href="/rsvp"{{ if eq .Active "/rsvp" }} aria-current="page"{{ end }}>RSVP</a></li>

<li><a href="/contact/about-us"{{ if eq .Active "/contact/about-us" }} aria-current="page"{{ end }}>About us</a></li>

</ul>
</li>
</ul>
</nav>
</header>
<main>
{{ block "content" . }}{{ end }}
</main>
</body>
</html>
