{{ define "site-nav" }}
<nav class="siteNav">
<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
<div class="siteNav-bar">
{{ if ne .Active "/" }}
<a class="siteMark" href="/" aria-label="Adrien &amp; Michael — home"><img class="siteMark-img" src="/static/img/ma-monogram.svg" alt="A &amp; M monogram"></a>
{{ end }}
<label for="nav-toggle" class="nav-toggle-label">
<span class="nav-toggle-bars" aria-hidden="true"></span>
<span>Menu</span>
</label>
</div>
<div class="siteNav-top">
<a href="/rsvp"{{ if hasPrefix .Active "/rsvp" }} aria-current="page"{{ end }}>RSVP</a>
<a href="/information"{{ if or (hasPrefix .Active "/information") (eq .Active "/faqs") }} aria-current="page"{{ end }}>Information</a>
<a href="/contact"{{ if hasPrefix .Active "/contact" }} aria-current="page"{{ end }}>Contact</a>
</div>
{{ if or (hasPrefix .Active "/information") (eq .Active "/faqs") }}
<div class="siteNav-sub">
<a href="/faqs"{{ if eq .Active "/faqs" }} aria-current="page"{{ end }}>FAQs</a>
<a href="/information/itinerary"{{ if eq .Active "/information/itinerary" }} aria-current="page"{{ end }}>Itinerary</a>
<a href="/information/travel"{{ if eq .Active "/information/travel" }} aria-current="page"{{ end }}>Travel</a>
<a href="/information/things-to-do"{{ if eq .Active "/information/things-to-do" }} aria-current="page"{{ end }}>Things to Do</a>
</div>
{{ else if hasPrefix .Active "/contact" }}
<div class="siteNav-sub">
<a href="/contact/about-us"{{ if eq .Active "/contact/about-us" }} aria-current="page"{{ end }}>About Us</a>
<a href="/contact/registry"{{ if eq .Active "/contact/registry" }} aria-current="page"{{ end }}>Registry</a>
<a href="/contact/get-in-touch"{{ if eq .Active "/contact/get-in-touch" }} aria-current="page"{{ end }}>Get in Touch</a>
</div>
{{ end }}
</nav>
{{ end }}
